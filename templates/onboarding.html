{% extends "base.html" %}
{% block title %}Welcome — TEAS Study{% endblock %}
{% block bottom_nav %}{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Let's Get Started</h1>
  <p class="subtitle">A few quick questions to personalize your study plan.</p>

  <form method="POST" action="/onboarding">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="form-group">
      <label for="display_name">What should we call you?</label>
      <input type="text" id="display_name" name="display_name"
             placeholder="Your first name"
             value="{{ user.display_name if user and user.display_name != 'Student' else '' }}">
    </div>
    <div class="form-group">
      <label for="exam_date">When is your TEAS exam?</label>
      <input type="date" id="exam_date" name="exam_date"
             value="{{ user.exam_date if user and user.exam_date else '' }}">
    </div>
    <div class="form-group">
      <label for="target_score">Target score (0–100)</label>
      <input type="number" id="target_score" name="target_score"
             min="0" max="100" value="{{ user.target_score if user else 80 }}">
    </div>
    <button type="submit" class="submit-btn" style="margin-top:8px">Start Studying</button>
  </form>

  <p class="auth-link"><a href="/">Skip for now</a></p>
</div>
{% endblock %}
